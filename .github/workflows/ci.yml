name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # tests/integration talks to a real database and skips itself without TEST_DATABASE_URL,
    # so without this service the suite would pass by never running. Image matches
    # docker-compose.yml. No Redis service: the suite drives the repository directly and
    # never touches the queue.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: integrations_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d integrations_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go build ./...
      - name: go test -race
        # integrations_test is the throwaway database the suite drops and re-migrates.
        # tests/e2e stays out: it drives a running API over HTTP and needs the full stack.
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/integrations_test?sslmode=disable
        run: go test -race $(go list ./... | grep -v '/tests/e2e')
