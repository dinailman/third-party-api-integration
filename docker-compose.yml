services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integrations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["15436:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d integrations"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["16381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    command: ["/bin/api"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/integrations?sslmode=disable
      REDIS_ADDR: redis:6379
    ports: ["8084:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: ["/bin/worker"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/integrations?sslmode=disable
      REDIS_ADDR: redis:6379
      WORKER_COUNT: "4"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
